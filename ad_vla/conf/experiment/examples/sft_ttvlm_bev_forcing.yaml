# @package _global_

# TextTrajVLM on Waymo with BEV forcing: a frozen SimpleBEV model turns the Waymo cameras into a
# bird's-eye-view occupancy map, and a cross-attention head must predict that map from the image
# tokens of language-model layer 23. Its binary cross-entropy is added to the trajectory loss with
# weight 0.25. Input: 3 front cameras at 544x480 and the past 4 s (16 poses at 0.25 s); output:
# 5 waypoints at 1 s.
#
#   python scripts/run_training.py +experiment=examples/sft_ttvlm_bev_forcing
#
# Needs BEV_MODEL_CKPT_PATH: a SimpleBEV checkpoint directory.

defaults:
  - /prompt: drive_poutine
  - /dataset@data.train.waymo: waymo
  - /dataset@data.val.waymo: waymo
  - override /model: text_traj_vlm
  - _self_

model:
  model_args:
    vlm_name_or_path: Qwen/Qwen3.5-2B
    past_traj_sampling:
      num_poses: 16
      interval_length: 0.25
    pred_traj_sampling:
      num_poses: 5
      interval_length: 1.0

prompt:
  use_cot: false

train_stage:
  optim_cfg:
    optimizer:
      lr: 1.0e-4
  lora_cfg:
    r: 16
    lora_alpha: 32
    target_modules: all-linear
    lora_dropout: 0.05
    bias: "none"
    task_type: "CAUSAL_LM"
  aux_head:
    _target_: ad_vla.models.aux_heads.bev_forcing.BEVForcingAuxHead
    bev_model_ckpt_path: ${oc.env:BEV_MODEL_CKPT_PATH}
    target_layer: 23
    train_bev_head_only: false
  aux_loss_weight: 0.25
  aux_warmup_steps: 0

logging:
  version: sft_ttvlm_bev_forcing

data:
  drop_cfg:
    past_traj: 0.2
  train:
    waymo: {size: [544, 480], sensors: front_three}
  val:
    waymo:
      size: [544, 480]
      sensors: front_three
      subset: ${oc.env:ASSETS_DIR}/indices/waymo_pref_idx.pt
