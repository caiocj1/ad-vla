# @package _global_

# FlowMatchingVLA: a 6-layer action expert (hidden size 1024) trained with flow matching on top of a
# frozen, already trained TextTrajVLM backbone (examples/sft_ttvlm_v1_qa), on the v1 mix
# (PhysicalAI, Waymo, NavSim, nuScenes; no QA). The expert reads the backbone's prompt KV cache and
# its own past-trajectory tokens (8 poses at 0.25 s); it outputs 20 poses at 0.25 s (5 s), averaged
# over 16 samples at evaluation. The prompt keeps the backbone's input: 4 past poses at 0.5 s.
#
#   python scripts/run_training.py +experiment=examples/sft_fm_vla
#
# Set model.model_args.backbone_ckpt if the backbone was exported elsewhere. action_stats are the
# training-set mean and std of the targets, from scripts/utils/compute_action_stats.py.

defaults:
  - /prompt: drive_poutine
  - /dataset_mix@data.train: v1
  - /dataset@data.val.waymo: waymo
  - /dataset@data.val.physical_ai: physical_ai
  - override /model: fm_vla
  - _self_

model:
  model_args:
    vlm_name_or_path: Qwen/Qwen3.5-2B
    backbone_ckpt: ${data.save_path}/sft_ttvlm_v1_qa/hf_ckpt
    action_representation: trajs
    past_traj_sampling:
      num_poses: 8
      interval_length: 0.25
    prompt_past_traj_sampling:
      num_poses: 4
      interval_length: 0.5
    pad_missing_past_traj: true
    pred_traj_sampling:
      num_poses: 20
      interval_length: 0.25
    diff_cfg:
      num_repeat_steps: 2
      num_eval_samples: 16
      eval_aggregation: mean
    expert_cfg:
      hidden_size: 1024
      intermediate_size: 4096
      num_layers: 6
      insulate_backbone: true
      past_traj_tokens: true
      past_traj_features: [xy, vel]
      past_traj_mode: per_pose
      past_traj_missing_token: true
    action_stats:
      action_representation: trajs
      pred_traj_sampling: {num_poses: 20, interval_length: 0.25}
      num_samples: 20000
      mean:
      - [1.47237, -0.00159]
      - [2.94406, -0.00208]
      - [4.4152, -0.00269]
      - [5.88512, -0.00326]
      - [7.3533, -0.00369]
