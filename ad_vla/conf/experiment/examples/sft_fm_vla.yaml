prompt:
  past_num_poses: 4
  past_interval: 0.5
  pred_num_poses: 5
  pred_interval: 1.0
  use_cot: false

train_stage:
  optim_cfg:
    optimizer:
      lr: 1.0e-4

logging:
  version: sft_fm_vla

data:
  train:
    nuscenes: {num_past_steps: 8}  # 4 s at 2 Hz for the expert's past tokens
  drop_cfg:
    past_traj: 0.2         # the prompt's past
    expert_past_traj: 0.2  # the expert's past tokens, dropped independently
  past_traj_truncation_prob: 0.25
  primary_val: waymo
  val:
    waymo:
      size: [608, 544]
      sensors: front_three
      subset: ${oc.env:ASSETS_DIR}/indices/waymo_pref_idx.pt
    physical_ai:
      size: [448, 768]
      sensors: front_three
      root: ${oc.env:HF_HOME}
      clip_ids_path: ${oc.env:PHYSICAL_AI_VAL_CLIP_IDS}
      stream: false
      revision: b719eea7f0a63619ef51ec7f54178af0937ef050
      num_history_steps: 40
      num_future_steps: 50
      num_frames: 1
  val_dataloader_args:
    num_workers: 4

trainer:
  max_epochs: 5

export:
  checkpoints: last
