defaults:
  - dataset@data.val_dataset: waymo     # mounted at data.val_dataset
  - model: text_traj_vlm
  - img_transform: default
  - train_stage: supervised_train
  - trainer: default
  - _self_

logging:
  disable_comet: true
  version: default_evaluation
  comet_workspace: ${oc.env:COMET_WORKSPACE,null}
  comet_project_name: ${oc.env:COMET_PROJECT_NAME,null}
  comet_api_key: ${oc.env:COMET_API_KEY,null}

data:
  image:
    height: 544
    width: 480

  val_dataset:
    split: val

  train_val_split: null
  val_subset_path: null
  # Optional metric grid. Null preserves each validation dataset's native grid.
  val_target_sampling: null
  reasoning_traces_path: null
  save_path: ${oc.env:OUTPUT_DIR,outputs}

  dataloader_args:
    batch_size: 4
    num_workers: 4
    pin_memory: true
