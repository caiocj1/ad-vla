name: drive

past_num_poses: ${model.model_args.past_traj_sampling.num_poses}
past_interval: ${model.model_args.past_traj_sampling.interval_length}
pred_num_poses: ${model.model_args.pred_traj_sampling.num_poses}
pred_interval: ${model.model_args.pred_traj_sampling.interval_length}

use_cot: false

intro: "You are an expert driver.\nInput:"

input_sections:
  images: "- 1 frame of multi-view images collected from the ego-vehicle at the present timestep"
  past_traj: "- past trajectory (at most ${prompt.past_num_poses} steps, ${prompt.past_interval}s intervals)"
  intent: "- Current high-level intent (string)"

task_text: |
  Task: Future Trajectory Prediction
  1. Given the input, predict the optimal future trajectory (${prompt.pred_num_poses} steps, ${prompt.pred_interval}s intervals) of the ego vehicle.
  Output format (raw text, not markdown or LaTeX):
  Future ego trajectory:[[x_1, y_1], [x_2, y_2], ..., [x_${prompt.pred_num_poses}, y_${prompt.pred_num_poses}]]

task_text_cot: |
  Task 1: Critical Objects and Conditions Detection
  Decide whether at least one critical instance of each class could influence the ego-vehicle's future path (no omissions).
  A vehicle can be a car, bus, truck, motorcyclist, scooter, etc. traffic_element includes traffic signs and traffic lights.
  road_hazard may include hazardous road conditions, road debris, obstacles, etc.
  A conflicting_vehicle is a vehicle that may potentially conflict with the ego's future path.
  Output "yes" or "no" for every class (no omissions).
  Object classes to audit:
  - nearby_vehicle
  - pedestrian
  - cyclist
  - construction
  - traffic_element
  - weather_condition
  - road_hazard
  - emergency_vehicle
  - animal
  - special_vehicle
  - conflicting_vehicle
  - door_opening_vehicle
  Output format (strict JSON, no extra keys, no commentary):
  {  "critical_objects": { "nearby_vehicle": "yes | no", "pedestrian": "yes | no", "cyclist": "yes | no", "construction": "yes | no", "traffic_element": "yes | no", "weather_condition": "yes | no", "road_hazard": "yes | no", "emergency_vehicle": "yes | no", "animal": "yes | no", "special_vehicle": "yes | no", "conflicting_vehicle": "yes | no", "door_opening_vehicle": "yes | no" }}
  Task 2: Lane Geometry Classification
  Analyze the images and the expert trajectory to assign a category to the lane geometry ahead from the ego vehicle's perspective:
  - lane_geometry ∈ { straight, intersection, soft_curve_left, soft_curve_right, sharp_curve_left, sharp_curve_right, other }
  Task 3: Natural Language Explanation
  Compose a concise natural-language description of the optimal future trajectory (${prompt.pred_num_poses} steps, ${prompt.pred_interval}s intervals) for the ego vehicle that the expert driver (you) plans and explain why the expert driver plans to execute this trajectory.
  - Mention only the classes you marked "yes" in the previous task.
  - Describe how each of those critical objects or conditions influences the optimal trajectory.
  - Do not invent objects or conditions not present in the input.
  Output format (strict JSON, no extra keys, no commentary):
  {  "explanation": "100-word description that references only the classes marked 'yes'" }
  Task 4: Meta-Behaviour Selection Assign exactly one category from each list.
  Choose the label that best summarises the overall behaviour of the optimal future trajectory:
  - speed ∈ { keep, accelerate, decelerate }
  - command ∈ { straight, yield, left_turn, right_turn, lane_follow, lane_change_left, lane_change_right, reverse }
  - If none fits, use 'other', but do this sparingly.
  Output format (strict JSON, no extra keys, no commentary):
  {  "meta_behaviour": { "speed": "keep | accelerate | decelerate | other", "command": "straight | yield | left_turn | right_turn | lane_follow | lane_change_left | lane_change_right | reverse | other" }}
  Task 5: Future Trajectory Prediction
  Given the input, critical objects/conditions, natural language explanation, and meta-behaviour, predict the optimal future trajectory (${prompt.pred_num_poses} steps, ${prompt.pred_interval}s intervals) of the ego vehicle.
  Output format (raw text, not markdown or LaTeX):
  Future ego trajectory:[[x_1, y_1], ..., [x_${prompt.pred_num_poses}, y_${prompt.pred_num_poses}]]
