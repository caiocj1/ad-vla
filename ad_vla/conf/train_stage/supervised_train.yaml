_target_: ad_vla.train_stages.supervised_train_module.SupervisedTrainModule


optim_cfg:
  # Optional per-branch learning rates. Null preserves the original optimizer setup.
  parameter_group_lrs: null

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1.0e-5
  
  lr_scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: null

  lr_interval: step

val_log_every_n_steps: 5

# Model-specific prediction settings used during validation/evaluation, passed to
# predict_from_processed_inputs as generate_cfg. null uses the model's defaults.
# FlowMatchingVLA: {num_eval_samples, eval_aggregation, eval_init, num_inference_steps}.
val_generate_cfg: null

lora_cfg: null

# Optional nn.Module instantiated by the train stage with `model=...`.
aux_head: null
aux_loss_weight: 1.0
aux_warmup_steps: null
