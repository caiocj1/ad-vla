defaults:
  - model: text_traj_vlm
  - train_stage: supervised_train
  - trainer: default
  - _self_

# Each entry of data.train / data.val states its own size and transform.

logging:
  disable_comet: true  # TensorBoard; false logs to Comet (COMET_* variables)
  version: default_training
  comet_workspace: ${oc.env:COMET_WORKSPACE,???}
  comet_project_name: ${oc.env:COMET_PROJECT_NAME,???}
  comet_api_key: ${oc.env:COMET_API_KEY,???}

data:
  # Name -> dataset config plus builder settings (ad_vla/dataset/builder.py). Mount each with
  # /dataset@data.train.<name>: <dataset> in the experiment's defaults, or a whole mix with
  # /dataset_mix@data.train: <mix>.
  train: {}
  val: {}
  primary_val: null  # needed with several trajectory sets; it logs eval/* and picks the best checkpoint
  val_periodic_samples: 1000  # cap per trajectory set during training; override with max_samples in an entry
  # Optional metric grid for validation (as in default_evaluation.yaml). Null keeps each
  # validation dataset's native grid.
  val_target_sampling: null
  reasoning_traces_path: null
  drop_cfg: null  # e.g. {intent: 0.3, past_traj: 0.1} to randomly drop inputs during training
  save_path: ${oc.env:SAVE_PATH,???}

  train_dataloader_args:
    batch_size: 4
    num_workers: 4
    pin_memory: true
    persistent_workers: false

  # Validation runs in the rank process to avoid forking workers after CUDA,
  # DDP, and the training worker pool are already active.
  val_dataloader_args:
    batch_size: 4
    num_workers: 0
    pin_memory: true
    persistent_workers: false

trainer:
  # training
  accumulate_grad_batches: 4 # default: global batch size 64 = (4 gpus) * (4 samples/gpu) * (4 accumulate grad steps)

  # evaluating
  val_check_interval: 1000 # evaluates every 1000 batches (not steps)

  # saving: latest checkpoint only
  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: step
      mode: max
      save_weights_only: false  # with the optimizer and progress, to resume from
      save_top_k: 1
      save_on_train_epoch_end: false
      dirpath: ${data.save_path}/${logging.version}/checkpoints
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: step

# Continue an interrupted run: `last` (newest checkpoint of this logging.version) or a .ckpt path.
# Needs the same config: data, batch size, GPUs and epochs. Runs before 2026-11 have no optimizer state.
resume_ckpt_path: null

# POST-TRAINING EXPORT:
export:
  # last: export the final checkpoint to hf_ckpt/ (also the behavior when `export` is absent).
  # last_and_best: also export the best checkpoint to best/hf_ckpt/. Needs exactly one
  # ModelCheckpoint in trainer.callbacks whose monitor equals best_monitor.
  checkpoints: last
  best_monitor: eval/ADE
