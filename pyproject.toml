[project]
name = "ad-vla"
version = "0.1.0"
description = "Vision-language-action models for end-to-end autonomous driving."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.12.0",
    "alpamayo-r1",
    "comet-ml>=3.55.0",
    "datasets>=4.5.0",
    "dotenv>=0.9.9",
    "easydict>=1.13",
    "matplotlib>=3.8",
    "navsim",
    "ninja>=1.13.0",
    "numpy==1.26.4",
    "packaging>=26.0",
    "pydantic>=2.12.5",
    "timm>=1.0.24",
    "tokenizers>=0.22.2",
    "torch==2.8.0+cu128",
    "torchaudio==2.8.0+cu128",
    "torchcubicspline",
    "torchvision==0.23.0+cu128",
    "transformers==5.18.0",
    "waymo-open-dataset-tf-2-12-0==1.6.7",
    "wheel>=0.46.3",
    "scikit-image>=0.22",
    "flash-attn>=2.8.3",
    "flash-linear-attention>=0.4.1",
    "causal-conv1d>=1.6.0",
    "lightning>=2.6.1",
    "peft>=0.18.1",
    "deepspeed>=0.18.7",
    "vggt>=0.0.1",
    "physical-ai-av>=0.2.2",
    "sentence-transformers>=5.4.1",
    "setuptools>=80.10.2",
    "simple-bev",
    "efficientnet-pytorch>=0.7.1",
    "addict>=2.4.0",
    "decord>=0.6.0",
    "pycolmap>=4.0.4",
    "trimesh>=4.12.2",
    "evo>=1.36.3",
    "plotly>=5.13.1",
    "py123d[nuscenes]>=0.0.8",
    "nuscenes-devkit>=1.2.0",
    "diffusers>=0.40.0",
]
packages = [{ include = "ad_vla" }]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
navsim = { git = "https://github.com/autonomousvision/navsim.git" }
vggt = { git = "https://github.com/facebookresearch/vggt.git" }
alpamayo-r1 = { git = "https://github.com/NVlabs/alpamayo.git" }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
torchcubicspline = { git = "https://github.com/patrick-kidger/torchcubicspline.git" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.0/causal_conv1d-1.6.0+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
simple-bev = { git = "https://github.com/caiocj1/simple_bev.git", branch = "master" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[tool.uv]
override-dependencies = [
    # vis4d 1.0.0 declares pydantic<2; the rest of the project needs 2.x.
    "pydantic>=2.12.5",
    "torch==2.8.0+cu128",
    "torchvision==0.23.0+cu128",
    "torchaudio==2.8.0+cu128",
    "hydra-core>=1.3.2",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "matplotlib>=3.8.0",
    "tensorflow>=2.16.0",
    "numpy>=1.23.0,<2",
    "opencv-python>=4.5",
    "setuptools>=67.6.0",
    "tensorboard>=2.12",
    "pyarrow>=16.0.0",
    "typing-extensions>=4.10.0",
    "jax==0.4.30",
    "jaxlib==0.4.30",
    # Exclude guppy3 - doesn't support Python 3.12 (uses removed C API)
    "guppy3 ; python_version < '3'",
    "scikit-image>=0.22",
    "transformers==5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["ad_vla"]

[tool.ruff.lint]
ignore = ["E402", "E731"] # ignore "Module level import not at top of file"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["ALL"]
