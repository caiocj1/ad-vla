[project]
name = "ad-vla"
version = "0.1.0"
description = "Research code for supervised vision-language trajectory prediction with optional BEV feature forcing."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.12.0",
    "addict>=2.4.0",
    "comet-ml>=3.55.0",
    "datasets>=4.5.0",
    "deepspeed>=0.18.7",
    "easydict>=1.13",
    "efficientnet-pytorch>=0.7.1",
    "flash-attn>=2.8.3",
    "flash-linear-attention>=0.4.1",
    "causal-conv1d>=1.6.0",
    "hydra-core>=1.3.2",
    "lightning>=2.6.1",
    "matplotlib>=3.8",
    "navsim",
    "ninja>=1.13.0",
    "numpy==1.26.4",
    "nuscenes-devkit>=1.2.0",
    "opencv-python>=4.5",
    "packaging>=26.0",
    "pandas>=2.3.3",
    "peft>=0.18.1",
    "pillow>=12.0.0",
    "physical-ai-av>=0.2.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "safetensors>=0.6.2",
    "scikit-image>=0.22",
    "setuptools>=80.10.2",
    "timm>=1.0.24",
    "tokenizers>=0.22.2",
    "torch==2.8.0+cu128",
    "torchaudio==2.8.0+cu128",
    "torchcubicspline",
    "torchvision==0.23.0+cu128",
    "transformers==5.2.0",
    "waymo-open-dataset-tf-2-12-0==1.6.7",
    "wheel>=0.46.3",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
navsim = { git = "https://github.com/autonomousvision/navsim.git" }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
torchcubicspline = { git = "https://github.com/patrick-kidger/torchcubicspline.git" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.0/causal_conv1d-1.6.0+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[tool.uv]
no-build-isolation-package = ["flash-attn"]
override-dependencies = [
    "torch==2.8.0+cu128",
    "torchvision==0.23.0+cu128",
    "torchaudio==2.8.0+cu128",
    "hydra-core>=1.3.2",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "matplotlib>=3.8.0",
    "tensorflow>=2.16.0",
    "numpy>=1.23.0,<2",
    "opencv-python>=4.5",
    "setuptools>=67.6.0",
    "tensorboard>=2.12",
    "pyarrow>=16.0.0",
    "typing-extensions>=4.10.0",
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "guppy3 ; python_version < '3'",
    "scikit-image>=0.22",
    "transformers==5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["ad_vla"]

[tool.ruff.lint]
ignore = ["E402", "E731"]
